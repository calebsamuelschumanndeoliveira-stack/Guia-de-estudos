<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guia de Estudos - organize matérias, tarefas, cronograma e notas em um só lugar." />
  <title>📚 Guia de Estudos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">📚</span>
        <div>
          <h1>Guia de Estudos</h1>
          <p class="brand-sub">Organize. Estude. Conquiste.</p>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>📊</span> Painel</button>
        <button class="nav-item" data-view="subjects"><span>📘</span> Matérias</button>
        <button class="nav-item" data-view="tasks"><span>✅</span> Tarefas</button>
        <button class="nav-item" data-view="schedule"><span>🗓️</span> Cronograma</button>
        <button class="nav-item" data-view="grades"><span>📈</span> Notas</button>
        <button class="nav-item" data-view="goals"><span>🎯</span> Metas</button>
      </nav>

      <div class="sidebar-footer">
        <div id="accountBox" class="account-box"></div>
        <div class="footer-row">
          <button id="themeToggle" class="ghost-btn" title="Alternar tema">🌙 Tema</button>
          <button id="notifyBtn" class="ghost-btn" title="Ativar lembretes de tarefas">🔔 Lembretes</button>
        </div>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="content">
      <div id="view-dashboard" class="view active"></div>
      <div id="view-subjects" class="view"></div>
      <div id="view-tasks" class="view"></div>
      <div id="view-schedule" class="view"></div>
      <div id="view-grades" class="view"></div>
      <div id="view-goals" class="view"></div>
    </main>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Título</h3>
        <button id="modalClose" class="icon-btn">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
